# Render "Blueprint": creates the Chroma model server from this repository in one step.
services:
  - type: web
    name: team8-chroma-model
    runtime: python
    plan: free
    region: frankfurt
    rootDir: 01_autoencoder/model_app
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
