<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e4e8">
<title>Chroma · create an account</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas class="field" id="field" aria-hidden="true"></canvas><div class="grain" id="grain" aria-hidden="true"></div>
<main>
  <div class="top"><a class="brand" href="/login">← Chroma</a></div>
  <section class="panel hero">
    <h1>Create your account</h1>
    <p class="muted">Your username is how friends find you. Add each other, chat, and jam: one camera, the same music on every phone.</p>
  </section>
  <form class="panel" method="post" action="/api/register">
    <label class="field-label" for="username"><b>Username</b> <span class="muted"><small>3 to 20 letters, numbers, _ or dots</small></span></label>
    <input class="text" type="text" id="username" name="username" required minlength="3" maxlength="20" pattern="@?[A-Za-z0-9_.]{3,20}" autocapitalize="none" spellcheck="false" autocomplete="username" placeholder="@yourname">
    <label class="field-label" for="name"><b>Name</b> <span class="muted"><small>optional, shown to friends</small></span></label>
    <input class="text" type="text" id="name" name="name" maxlength="60" autocomplete="name">
    <label class="field-label" for="email"><b>Email</b></label>
    <input class="text" type="email" id="email" name="email" required autocomplete="email">
    <label class="field-label" for="pw"><b>Password</b> <span class="muted"><small>at least 8 characters</small></span></label>
    <input class="text" type="password" id="pw" name="password" required minlength="8" autocomplete="new-password">
    <p id="msg" class="status wait" role="status"></p>
    <button class="cta" type="submit"><span aria-hidden="true">✦</span> Create account</button>
    <p class="muted"><small>Already have one? <a href="/login"><b>Log in</b></a>.</small></p>
  </form>
</main>
<script type="module">
  import { livingGradient } from "/chroma-gradient.js";
  livingGradient({ canvas: document.getElementById("field"), grain: document.getElementById("grain") }).intro();
  const q = new URLSearchParams(location.search);
  if (q.get("error")) document.getElementById("msg").textContent = q.get("error");
  if (q.get("u")) document.getElementById("username").value = q.get("u");
  if (q.get("e")) document.getElementById("email").value = q.get("e");
</script>
</body>
</html>
