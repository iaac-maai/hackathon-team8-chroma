<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chroma Gradient Prototype</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --accent: #3a5ccc; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141413; --panel: #1f1f1d; --ink: #f1efe9; --muted: #9c9a94; --line: #34332f;
          --accent: #8aa4ff; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 16px; }
.drop { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 28px 16px; text-align: center; background: var(--panel); cursor: pointer; }
.drop.over { border-color: var(--accent); }
.drop b { display: block; font-size: 16px; margin-bottom: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 20px; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.card h2 { margin: 0 0 10px; font-size: 15px; word-break: break-all; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair figure { margin: 0; }
.pair canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; display: block; }
.pair figcaption { color: var(--muted); font-size: 12px; margin-top: 4px; }
.bar { height: 26px; border-radius: 6px; margin: 12px 0 6px; }
.stops { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; font-size: 11px; color: var(--muted); text-align: center; }
.stops span { display: block; height: 22px; border-radius: 4px; margin-bottom: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
.metric { display: grid; grid-template-columns: 90px 1fr 42px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
.track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.music div { margin: 3px 0; font-size: 13px; }
.music b { display: inline-block; min-width: 80px; color: var(--muted); font-weight: 500; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
@media (max-width: 760px) { .layout, .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Chroma · gradient map prototype</h1>
  <p class="sub">Drop photos to see their gradient map: 8 colours from the darkest to the lightest pixels, and the photo repainted through them. Same method as <code>data_prep/extract_gradient.py</code>. Photos stay in your browser.</p>
  <label class="drop" id="drop">
    <b>Drop photos here, or click to choose</b>
    <span class="sub">JPG or PNG · as many as you like</span>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </label>
  <div class="row">
    <button id="examples">Try 6 example photos from the dataset</button>
    <button id="clear">Clear</button>
  </div>
  <div id="out"></div>
</main>
<script>
const STOPS = 8, SIZE = 128;

// sRGB (0-1) <-> CIE Lab (D65), as in scikit-image
const lin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const unlin = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
const Xn = 0.95047, Yn = 1.0, Zn = 1.08883;
const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
const fi = t => t > 0.206893 ? t * t * t : (t - 16 / 116) / 7.787;
function rgb2lab(r, g, b) {
  r = lin(r); g = lin(g); b = lin(b);
  const x = (0.412453 * r + 0.357580 * g + 0.180423 * b) / Xn;
  const y = (0.212671 * r + 0.715160 * g + 0.072169 * b) / Yn;
  const z = (0.019334 * r + 0.119193 * g + 0.950227 * b) / Zn;
  const fy = f(y);
  return [y > 0.008856 ? 116 * fy - 16 : 903.3 * y, 500 * (f(x) - fy), 200 * (fy - f(z))];
}
function lab2rgb(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const x = fi(fx) * Xn, y = fi(fy) * Yn, z = fi(fz) * Zn;
  const r = 3.240479 * x - 1.537150 * y - 0.498535 * z;
  const g = -0.969256 * x + 1.875992 * y + 0.041556 * z;
  const bb = 0.055648 * x - 0.204043 * y + 1.057311 * z;
  return [r, g, bb].map(c => Math.min(1, Math.max(0, unlin(Math.max(0, c)))));
}
const hex = rgb => "#" + rgb.map(c => Math.round(c * 255).toString(16).padStart(2, "0")).join("");

function analyse(img) {
  const c = document.createElement("canvas"); c.width = c.height = SIZE;
  const ctx = c.getContext("2d");
  // centre crop to a square, like the dataset photos
  const s = Math.min(img.naturalWidth, img.naturalHeight);
  ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, SIZE, SIZE);
  const px = ctx.getImageData(0, 0, SIZE, SIZE).data, n = SIZE * SIZE;
  const lab = new Float64Array(n * 3), sat = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const r = px[4 * i] / 255, g = px[4 * i + 1] / 255, b = px[4 * i + 2] / 255;
    const [L, A, B] = rgb2lab(r, g, b); lab[3 * i] = L; lab[3 * i + 1] = A; lab[3 * i + 2] = B;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); sat[i] = mx ? (mx - mn) / mx : 0;
  }
  // 1-3: sort by lightness, 8 equal groups, mean Lab per group
  const order = Array.from({ length: n }, (_, i) => i).sort((p, q) => lab[3 * p] - lab[3 * q]);
  const stops = [];
  for (let k = 0; k < STOPS; k++) {
    const a = Math.floor(k * n / STOPS), z = Math.floor((k + 1) * n / STOPS);
    let L = 0, A = 0, B = 0;
    for (let j = a; j < z; j++) { const i = order[j]; L += lab[3 * i]; A += lab[3 * i + 1]; B += lab[3 * i + 2]; }
    const m = z - a; stops.push([L / m, A / m, B / m]);
  }
  // 4: repaint each pixel with the gradient colour at its lightness
  const out = ctx.createImageData(SIZE, SIZE);
  for (let i = 0; i < n; i++) {
    const L = lab[3 * i];
    let k = 0; while (k < STOPS - 2 && L > stops[k + 1][0]) k++;
    const t = Math.min(1, Math.max(0, (L - stops[k][0]) / ((stops[k + 1][0] - stops[k][0]) || 1)));
    const mix = [0, 1, 2].map(d => stops[k][d] + t * (stops[k + 1][d] - stops[k][d]));
    const rgb = lab2rgb(...mix);
    out.data[4 * i] = rgb[0] * 255; out.data[4 * i + 1] = rgb[1] * 255; out.data[4 * i + 2] = rgb[2] * 255; out.data[4 * i + 3] = 255;
  }
  // colour values, same formulas as extract_palette.py
  let Ls = 0, L2 = 0, S = 0, W = 0, Wt = 0;
  for (let i = 0; i < n; i++) {
    const L = lab[3 * i] / 100; Ls += L; L2 += L * L; S += sat[i];
    const w = 0.2 + sat[i]; W += (lab[3 * i + 2] + 0.5 * lab[3 * i + 1]) * w; Wt += w;
  }
  const brightness = Ls / n, sd = Math.sqrt(Math.max(0, L2 / n - brightness ** 2));
  const vals = {
    brightness, saturation: S / n, contrast: Math.min(sd / 0.3, 1),
    warmth: Math.min(1, Math.max(0, 0.5 + (W / Wt) / 60)),
  };
  return { src: c, out, stops, vals };
}

function music(v, stops) {
  const scale = v.brightness >= 0.55 && v.warmth >= 0.6 ? "lydian" : v.brightness >= 0.5 ? "major" : v.brightness < 0.35 ? "minor" : "dorian";
  const range = (stops[STOPS - 1][0] - stops[0][0]) / 100;
  return {
    scale: `D ${scale}`,
    bass: `from the darkest stop ${hex(lab2rgb(...stops[0]))}`,
    melody: v.saturation >= 0.30 ? "yes (colourful)" : "no (greyish)",
    tone: v.brightness >= 0.5 ? "bright, open" : "dark, muffled",
    drums: `${Math.round(v.contrast * 100)} % hit strength`,
    "light range": `${Math.round(range * 100)} % (shadow to highlight)`,
  };
}

function render(name, img) {
  const r = analyse(img);
  const card = document.createElement("div"); card.className = "card";
  const stopHex = r.stops.map(s => hex(lab2rgb(...s)));
  const m = music(r.vals, r.stops);
  card.innerHTML = `
    <h2>${name}</h2>
    <div class="layout">
      <div class="pair">
        <figure><canvas class="a"></canvas><figcaption>photo (centre crop)</figcaption></figure>
        <figure><canvas class="b"></canvas><figcaption>gradient map</figcaption></figure>
      </div>
      <div>
        <div class="bar" style="background:linear-gradient(90deg,${stopHex.map((h, i) => `${h} ${Math.round(i / 7 * 100)}%`).join(",")})"></div>
        <div class="stops">${stopHex.map((h, i) => `<div><span style="background:${h}"></span>${i + 1}<br>${h}</div>`).join("")}</div>
        <div class="grid2">
          <div>${Object.entries(r.vals).map(([k, v]) => `<div class="metric"><span>${k}</span><div class="track"><div class="fill" style="width:${Math.round(v * 100)}%"></div></div><span class="num">${v.toFixed(2)}</span></div>`).join("")}</div>
          <div class="music">${Object.entries(m).map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join("")}</div>
        </div>
      </div>
    </div>`;
  const a = card.querySelector(".a"), b = card.querySelector(".b");
  a.width = a.height = b.width = b.height = SIZE;
  a.getContext("2d").drawImage(r.src, 0, 0); b.getContext("2d").putImageData(r.out, 0, 0);
  document.getElementById("out").prepend(card);
}

function loadFile(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { render(file.name, img); URL.revokeObjectURL(url); };
  img.src = url;
}
const drop = document.getElementById("drop");
document.getElementById("file").onchange = e => [...e.target.files].forEach(loadFile);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); [...e.dataTransfer.files].filter(f => f.type.startsWith("image/")).forEach(loadFile); };
document.getElementById("clear").onclick = () => document.getElementById("out").innerHTML = "";
document.getElementById("examples").onclick = () => {
  const ex = ["airport/Places365_val_00016772.jpg", "beach/Places365_val_00014602.jpg", "market/Places365_val_00025142.jpg", "metro/Places365_val_00011453.jpg", "mountains/Places365_val_00006235.jpg", "street/Places365_val_00011376.jpg"];
  ex.forEach(p => { const img = new Image(); img.onload = () => render(p.split("/")[0], img); img.onerror = () => {}; img.src = "../data/places/" + p; });
};
</script>
</body>
</html>
